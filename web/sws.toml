# static-web-server config for ghcr.io/loknopf/status-web.
# Serves /public read-only on :8080; Traefik routes everything except /api/* here.

[general]
host = "0.0.0.0"
port = 8080
root = "/public"
log-level = "warn"

page404 = "/public/404.html"
directory-listing = false
ignore-hidden-files = true
disable-symlinks = true
redirect-trailing-slash = true
compression = true
health = true

# Cache headers are set below instead of SWS' defaults (one year for js/css), so a deploy
# shows up on the next page load without cache-busting file names.
cache-control-headers = false
security-headers = false

# Small fixed thread pool: the container runs with a pids limit.
threads-multiplier = 1
max-blocking-threads = 8

[advanced]

[[advanced.headers]]
source = "**"
[advanced.headers.headers]
Cache-Control = "no-cache"
Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
Referrer-Policy = "strict-origin-when-cross-origin"
Strict-Transport-Security = "max-age=31536000"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"

[[advanced.headers]]
source = "/assets/fonts/*.woff2"
headers = { Cache-Control = "public, max-age=31536000, immutable" }
