name: Build Docker Image

# Every push (branches and tags): build both images and smoke-test them. Nothing is published.
on:
  push:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build status
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: smoke/status:test
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=status
          cache-to: type=gha,mode=max,scope=status

      - name: Build status-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          load: true
          tags: smoke/status-web:test
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=status-web
          cache-to: type=gha,mode=max,scope=status-web

      - name: Smoke test
        run: |
          .github/scripts/smoke.sh status smoke/status:test
          .github/scripts/smoke.sh status-web smoke/status-web:test
