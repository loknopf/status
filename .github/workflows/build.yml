name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: status
            dockerfile: Dockerfile
          - image: status-web
            dockerfile: web/Dockerfile
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build for the runner first and start it the way the server does (read-only, no
      # capabilities, non-root) so a broken config or image never gets published.
      - name: Build for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: smoke:${{ matrix.image }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Smoke test (gatus)
        if: matrix.image == 'status'
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 -e TRAEFIK_HOST=proxy.invalid \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=16m,mode=1777 --mount type=volume,dst=/data \
            smoke:status
          # The API answers right away but lists endpoints only once they have a result; wait
          # until both checks of the hidden proxy have run.
          proxy='[.[] | select(.key | endswith("reverse-proxy")) | select(.results | length > 0)] | length == 2'
          for i in $(seq 1 60); do
            body=$(curl -fsS http://127.0.0.1:8080/api/v1/endpoints/statuses || true)
            if jq -e "$proxy" <<<"$body" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker logs smoke
          test "$(docker inspect -f '{{.State.Running}}' smoke)" = true
          jq -e "$proxy" <<<"$body"
          # the hidden endpoint must not leak its hostname through the API
          if echo "$body" | grep -q 'proxy\.invalid'; then echo "hidden hostname leaked"; exit 1; fi

      - name: Smoke test (web)
        if: matrix.image == 'status-web'
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            smoke:status-web
          for i in $(seq 1 15); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          docker logs smoke
          page=$(curl -fsS http://127.0.0.1:8080/)
          headers=$(curl -fsSI http://127.0.0.1:8080/)
          meta=$(curl -fsS http://127.0.0.1:8080/endpoints.json)
          grep -q "${GITHUB_SHA::7}" <<<"$page"
          grep -qi '^content-security-policy:' <<<"$headers"
          jq -e 'length > 0' <<<"$meta"
          if grep -q 'TRAEFIK_HOST' <<<"$meta"; then echo "hidden endpoint URL published"; exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope)" = 404

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
