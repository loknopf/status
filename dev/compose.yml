# Local copy of the production setup with the real checks: http://localhost:8080
#
#   docker compose -f dev/compose.yml up --build
#
# Traefik routes /api/* to Gatus and everything else to the static site, as on the server.
# To work on the page with 90 days of fake history instead, use dev/mock.py (see README).

name: status-dev

services:
  gatus:
    build: { context: .., dockerfile: Dockerfile }
    environment:
      # export TRAEFIK_HOST=<dashboard hostname> to check the real proxy; the default just fails
      TRAEFIK_HOST: ${TRAEFIK_HOST:-proxy.invalid}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes: ["gatus-data:/data"]

  web:
    build: { context: .., dockerfile: web/Dockerfile }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  proxy:
    image: traefik:v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    command:
      - --entrypoints.web.address=:8080
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --log.level=WARN
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro"]
    depends_on: [gatus, web]

volumes:
  gatus-data:
